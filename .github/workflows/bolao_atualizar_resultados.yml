name: Bolão - Atualizar Resultados

on:
  workflow_dispatch: 

jobs:
  mandar-resultados-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar Resultados (API)
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID:           ${{ secrets.SHEET_ID }}
          RODADAS:            ${{ secrets.RODADAS }}
          COMPETICAO:         ${{ secrets.COMPETICAO }}
        run: python -m scripts.atualizar_dados.atualizar_resultados

      - name: Atualizar Ranking
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID:           ${{ secrets.SHEET_ID }}
        run: python -m scripts.atualizar_dados.atualizar_ranking